name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    # node-pty needs a native rebuild against Electron's ABI (postinstall runs
    # `electron-builder install-app-deps --arch=arm64`). GitHub's macos-latest
    # runners are Apple Silicon (arm64), matching that hardcoded arch, and
    # ship Xcode Command Line Tools for the node-gyp compile step — this is
    # the runner that actually works with npm ci as-is. ubuntu-latest is x64
    # and would need the arch override changed (or a build-essential step)
    # just to get a mismatched-platform binary; not attempted here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit
